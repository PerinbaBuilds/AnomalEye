# Fly.io deployment config. Run: fly launch --no-deploy  (accept this file),
# then: fly deploy
app = "anomaleye"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Set the Groq key as a secret (never in this file):
#   fly secrets set GROQ_API_KEY=your_key
