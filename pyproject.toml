[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaleye"
version = "1.0.0"
description = "Agentic AI system for AML suspicious-activity detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4"]

[project.scripts]
anomaleye = "anomaleye.cli:main"

[tool.setuptools.packages.find]
include = ["anomaleye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
