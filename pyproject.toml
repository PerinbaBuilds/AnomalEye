[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaleye"
version = "1.0.0"
description = "Agentic AI system for AML suspicious-activity detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.setuptools]
py-modules = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
anomaleye = "anomaleye.cli:main"

[tool.setuptools.packages.find]
include = ["anomaleye*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
