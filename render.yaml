# Render blueprint — one-click deploy from the GitHub repo.
# https://render.com  →  New +  →  Blueprint  →  pick this repo.
services:
  - type: web
    name: anomaleye
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Enter your Groq key in the Render dashboard (kept secret, never in git).
      # Leave it unset and the agent runs the deterministic rule-based planner.
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
