# Render blueprint — one-click deploy from the GitHub repo.
# https://render.com  →  New +  →  Blueprint  →  pick this repo.
services:
  - type: web
    name: anomaleye
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
